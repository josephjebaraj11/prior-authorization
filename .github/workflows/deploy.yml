name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  # Lets you redeploy the current main from the Actions tab.
  workflow_dispatch:

# Publishing is a force-push to the gh-pages branch, so plain repo write is all
# this needs — no Pages API, no OIDC, no github-pages environment.
permissions:
  contents: write

# Never let two deploys race; queue the newer one and let the running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # A project site is served from /<repo>/, so the app is built to expect
      # that prefix. Swap to "/" if you point a custom domain at this site.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # gh-pages holds only the built site, with no history worth keeping, so
      # each deploy is a fresh single commit force-pushed over the last one.
      - name: Publish to gh-pages
        working-directory: web/build/client
        run: |
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA}"
          git push -qf \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
