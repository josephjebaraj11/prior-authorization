name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  # Lets you redeploy the current main from the Actions tab.
  workflow_dispatch:

# Read the repo, mint the OIDC token deploy-pages exchanges for an upload URL.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue the newer one and let the running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # A project site is served from /<repo>/, so the app is built to expect
      # that prefix. Swap to "/" if you point a custom domain at this site.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # `enablement` turns Pages on for the repo if it is not already, so the
      # first run does not fail with "Get Pages site failed". It also sets the
      # source to GitHub Actions, which is what this workflow deploys through.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
